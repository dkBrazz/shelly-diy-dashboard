server:
  forward-headers-strategy: native
  servlet:
    session:
      timeout: 30d
      cookie:
        max-age: 30d

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:shelly}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile

# Only the health and info endpoints are exposed; both are reachable without login so
# Docker/Kubernetes probes work. Health shows the status only, never component details.
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

app:
  auth:
    # Comma-separated Google account emails seeded into the allowlist on startup.
    allowed-emails: ${APP_ALLOWED_EMAILS:}

shelly:
  cloud:
    # Deprecated override. The token-exchange server is derived from the authorization code's
    # user_api_url claim; leave this empty unless that derivation is wrong.
    region: ${SHELLY_REGION:}
    # The region from user_api_url is always monitored in addition to this list.
    websocket-regions: ${SHELLY_WEBSOCKET_REGIONS:shelly-241-eu,shelly-242-eu}
    auth-code: ${SHELLY_AUTH_CODE}
    client-id: ${SHELLY_CLIENT_ID:shelly-diy}
  dashboard:
    max-measures: 150
    # Longest history window a single request may cover; wider ranges are rejected with 400.
    max-range: 90d
    # Gaps between samples shorter than this are bridged in graphs; longer silences are drawn as zero.
    offline-threshold: 30s
