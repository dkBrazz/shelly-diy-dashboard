services:
  app:
    # Published to GHCR by .github/workflows/ci.yml after the checks pass. Run `docker compose build` to build locally instead.
    image: ghcr.io/dkbrazz/shelly-diy-dashboard:${APP_IMAGE_TAG:-main}
    build: .
    pull_policy: missing
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      # Inside the Compose network the database is always reachable at this address,
      # regardless of the host port mapping configured for timescaledb below.
      DB_HOST: timescaledb
      DB_PORT: 5432
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      timescaledb:
        condition: service_healthy

  timescaledb:
    image: timescale/timescaledb:2.25.2-pg18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-shelly}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - timescaledb-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  timescaledb-data:
